<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        form{
            background: #52c7eb;
            border-radius: 50px;
          
            padding: 500px;
            justify-content:center;
            padding: 300px;

        }
        
    </style>
</head>
<body align="center">
    <form action="forms.html" target="_blank" method="get">
         <label for="name">Enter Full Name</label>
        <input type="text" placeholder="Enter Name" id="Name" required><br>
        <label for="Email">Email:</label>
        <input type="text" placeholder="Email or User Name" id="Email" required><br>
        <label for="Password"> Set Password:</label>
        <input type="password" placeholder="Enter Correct Password" id="Password" required><br>
        <label for="phone">Mobile:</label>
        <input type="tel" placeholder="Mobile" id="phone" required><br>
        <label for="gender">Gender</label>
        

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
