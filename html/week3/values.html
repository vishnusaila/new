<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
       
       body{
            background: #52c7eb;
            border-radius: 50px;
          
            padding: 500px;
            justify-content:center;
            padding: 300px;

        }
        
    </style>
</head>
<body align="center">
    <h1> All input type Values</h1>
    <label for="text">text</label>
    <input type="text" id="text" required><br>
    <label for="email">email</label>
    <input type="email" id="email" required><br>
    <label for="pass">password</label>
    <input type="password" id="pass" required><br>
    <label for="number">number</label>
    <input type="number" id="number" required><br>
    <label for="tell">Phone</label>
    <input type="tel" id="tell" required><br>
    <label for="checkboxx">checkbox</label>
    <input type="checkbox" id="checkboxx" required><br>
    <label for="submitt">submit</label>
    <input type="submit" id="submitt" required><br>
    <label for="button">button</label>
    <input type="button"  value="button" id="button" required><br>
    <label for="color">color</label>
    <input type="color" id="color" required><br>
    <label for="date">date</label>
    <input type="date" id="date" required><br>
    <label for="dt">date&time</label>
    <input type="datetime" id="dt" required><br>
    <label for="week">Week</label>
    <input type="week" id="week" required><br>
    <label for="uplode">file</label>
    <input type="file" id="uplode" required><br>
    <label for="hidden">hidden</label>
    <input type="hidden" id="hidden" required><br>
    <label for="month">month</label>
    <input type="month" id="month" required><br>
    <label for="img">imge</label>
    <input type="image" id="img" required><br>
    <label for="ramge">range</label>
    <input type="range" id="range" required><br>
    <label for="reset">reset</label>
    <input type="reset" id="reset" required><br>
    <label for="search">search</label>
    <input type="search" id="search" required><br>
    <label for="url">URl path</label>
    <input type="url" id="radio" required><br>
</body>
</html>
