    <form>
    <fieldset>
        <legend>Application Details</legend>
        <label for="name">Name *</label>

        <label for="male">Male</label>
        <input type="radio" id="female" value="gender" name="gender">
        <label for="female"> Female</label><br>

       
        <label for="ph">WhatsApp No *</label>
        <input type="tel" id="ph" required>
        <label for="email">E-mail Id *</label>
        <input type="email" id="email" required><br>
        <label for="photo">Photo *</label>
        <input type="file" id="photo" required>
        <label for="Aadno">Aadhaar No *</label>
        <input type="number" id="Aadno" required><br>
    </fieldset>
    <fieldset>

    <fieldset>
        <legend>Pass Type Details</legend>
        <label for="city">City *</label>
        <select>
            <option value="city" id="city">HYDERABAD</option> 
        </select><br>
        <label for="passt">Pass Type *</label>

        </select><br>

            <option  id="payment" selected>Select Pass Delivery Mode</option>

        </select><br>
